"|": |
  `x | y`: Union — commits in either `x` or `y`.
"&": |
  `x & y`: Intersection — commits in both `x` and `y`.
"~": |
  As infix: `x ~ y` — Difference (commits in `x` but not in `y`).
  As prefix: `~x` — Complement (commits not in `x`).
"::": |
  As infix: `x :: y` — DAG range. Descendants of `x` that are also ancestors of `y`.
  As prefix: `::x` — Ancestors of `x`, including `x` itself.
  As postfix: `x ::` — Descendants of `x`, including `x` itself.
  Standalone: `::` — All visible commits.
"..": |
  As infix: `x .. y` — Range. Ancestors of `y` that are not ancestors of `x`. Note that `x` itself is excluded, but `y` is included.
  As prefix: `..x` — Ancestors of `x`, excluding the root commit.
  As postfix: `x ..` — Commits that are not ancestors of `x`.
  Standalone: `..` — All visible commits excluding the root commit.
"-": |
  `x -`: Parents of `x` (postfix, repeatable). `x--` is grandparents, `x---` is great-grandparents, etc.
"+": |
  `x +`: Children of `x` (postfix, repeatable). `x++` is grandchildren, etc.
