object_id: |
  `object_id()`: Returns the full hexadecimal object ID as a [String](jj://template-method-string/len) for files (`file_id`), symlinks (`symlink_id`), trees (`tree_id`), or Git submodules (`commit_id`).
file_type: |
  `file_type()`: Returns the value type as a [String](jj://template-method-string/len): one of `"file"`, `"symlink"`, `"tree"`, or `"git-submodule"`.
executable: |
  `executable()`: Returns `true` if the value is an executable file.
