name: |
  `name()`: Returns the workspace name as a RefSymbol.
current_workspace: |
  `current_workspace()`: Returns `true` if this is the current workspace. Note this can differ from `self.target().current_working_copy()` because multiple workspaces can point to the same commit.
target: |
  `target()`: Returns the target [Commit](jj://template-method-commit/description).
root: |
  `root()`: Returns the workspace root path as `Option<FsPath>`. May be absent for workspaces created before jj 0.38.0 or if the recorded path is stale.