version: 2
before:
  hooks:
    - go mod download
    - sh -c 'curl -fsSL https://github.com/carapace-sh/carapace-man/releases/download/v0.0.6/carapace-man_0.0.6_linux_amd64.tar.gz | tar -xz -C /usr/local/bin'
    - carapace-man compile man jj.db
builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    main: ./cmd/carapace-jjlex
    binary: carapace-jjlex
archives:
  - id: default
    ids:
     - default
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  extra_files:
    - glob: ./jj.db
